server {
    listen       80;
    listen       [::]:80 default_server;
    server_name  projetonovo www.projetonovo;

    # Logs
    access_log /var/log/nginx/projetonovo.access.log;
    error_log /var/log/nginx/projetonovo.error.log;

    location / {
        proxy_pass http://unix:/home/adminuser/Documents/python/projetonovo/projetonovo.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 404 /404.html;
        location = /40x.html {
    }

    error_page 500 502 503 504 /50x.html;
        location = /50x.html {
    }
}
